name: Repackage Salamander SF2 as ZIP
on:
  push:
    paths:
      - '.github/workflows/salamander.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repackage:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Download source archive from FreePats
        run: |
          curl --fail --location --retry 5 --retry-delay 5 --connect-timeout 30 --max-time 1200 \
            'https://freepats.zenvoid.org/Piano/SalamanderGrandPiano/SalamanderGrandPiano-SF2-V3%2B20200602.tar.xz' \
            -o /tmp/Salamander.sf2.tar.xz
          test "$(stat -c '%s' /tmp/Salamander.sf2.tar.xz)" -gt 200000000
          tar -tJf /tmp/Salamander.sf2.tar.xz > /tmp/salamander-files.txt
          head -30 /tmp/salamander-files.txt
      - name: Create ZIP containing only the SF2
        run: |
          mkdir -p /tmp/salamander
          tar -xJf /tmp/Salamander.sf2.tar.xz --directory /tmp/salamander
          SF2=$(find /tmp/salamander -type f -iname '*.sf2' | head -1)
          test -n "$SF2"
          cp "$SF2" './SalamanderGrandPiano.sf2'
          zip -9 SalamanderGrandPiano-SF2.zip SalamanderGrandPiano.sf2
          sha256sum SalamanderGrandPiano-SF2.zip SalamanderGrandPiano.sf2 > SalamanderGrandPiano-SF2.sha256
          rm SalamanderGrandPiano.sf2
          ls -lh SalamanderGrandPiano-SF2.*
      - name: Publish ZIP and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG=salamander-sf2-v3
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" SalamanderGrandPiano-SF2.zip SalamanderGrandPiano-SF2.sha256 --clobber
          else
            gh release create "$TAG" SalamanderGrandPiano-SF2.zip SalamanderGrandPiano-SF2.sha256 \
              --target "$GITHUB_SHA" --title 'Salamander Grand Piano SF2 · ZIP for Android' \
              --notes 'Unmodified SF2 from FreePats, repackaged as ZIP. Source author Alexander Holm, CC BY 3.0. Source: https://freepats.zenvoid.org/Piano/acoustic-grand-piano.html'
          fi
