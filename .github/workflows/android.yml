name: Android CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android platform and native tools
        run: sdkmanager --install 'platforms;android-36' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Native queue and source checks
        run: bash tests/run_tests.sh
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Verify APK packaging
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -Z1 "$APK" | grep -Fq 'lib/arm64-v8a/libliveperformer.so'
          unzip -Z1 "$APK" | grep -Fq 'lib/arm64-v8a/libfluidsynth.so'
          unzip -Z1 "$APK" | grep -Fq 'assets/GeneralUser-GS.sf2'
      - name: Publish installable debug APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk LivePerformer-v0.1.0-debug.apk
          TAG=v0.1.0-dev
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" LivePerformer-v0.1.0-debug.apk --clobber
          else
            gh release create "$TAG" LivePerformer-v0.1.0-debug.apk \
              --target "$GITHUB_SHA" --prerelease \
              --title "LivePerformer v0.1.0 Android debug" \
              --notes "Experimental Android debug build. Hardware audio latency and USB MIDI not yet verified."
          fi
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LivePerformer-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
