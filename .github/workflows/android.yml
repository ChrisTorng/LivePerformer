name: Android CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android platform and native tools
        run: sdkmanager --install 'platforms;android-37.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Native queue and source checks
        run: bash tests/run_tests.sh
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Restore persistent development signing key
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          KEY=app/dev-signing.keystore
          if gh release view dev-signing-key >/dev/null 2>&1; then
            gh release download dev-signing-key --pattern liveperformer-dev.keystore --dir .
            mv liveperformer-dev.keystore "$KEY"
          else
            keytool -genkeypair -noprompt -keystore "$KEY" -storepass android -keypass android \
              -alias liveperformer-dev -keyalg RSA -keysize 3072 -validity 10000 \
              -dname 'CN=LivePerformer DEV ONLY, OU=Public Test Signing, O=LivePerformer, C=TW'
            cp "$KEY" liveperformer-dev.keystore
            gh release create dev-signing-key liveperformer-dev.keystore --target "$GITHUB_SHA" \
              --title 'Public test-only signing key (never use for production)' --prerelease \
              --notes 'PUBLIC development key. Anyone can sign APKs with this key. Do not use for production releases. The previous ephemeral debug certificate cannot be reused. One-time uninstall may be required.'
          fi
          keytool -list -v -keystore "$KEY" -storepass android | grep 'SHA256:'
      - name: Test SF2 preset parser
        run: gradle :app:testDebugUnitTest --stacktrace --no-daemon
      - name: Build optimized release APK
        run: gradle :app:assembleRelease --stacktrace --no-daemon
      - name: Verify release APK packaging and signing
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -Z1 "$APK" > apk-entries.txt
          echo "Release APK native libraries and assets:"
          grep -E '^(lib/arm64-v8a/|assets/)' apk-entries.txt | head -70 || true
          grep -Fxq 'lib/arm64-v8a/libliveperformer.so' apk-entries.txt || { echo "::error::Missing lib/arm64-v8a/libliveperformer.so"; exit 1; }
          grep -Fxq 'lib/arm64-v8a/libfluidsynth.so' apk-entries.txt || { echo "::error::Missing lib/arm64-v8a/libfluidsynth.so"; exit 1; }
          grep -Fxq 'assets/GeneralUser-GS.sf2' apk-entries.txt || { echo "::error::Missing assets/GeneralUser-GS.sf2"; exit 1; }
          $ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner verify --verbose "$APK"
      - name: Publish optimized APK (development certificate)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk LivePerformer-v0.4.6.apk
          zip -9 LivePerformer-v0.4.6.zip LivePerformer-v0.4.6.apk
          sha256sum LivePerformer-v0.4.6.apk > LivePerformer-v0.4.6.sha256
          TAG=v0.4.6-dev
          NOTES="Non-debuggable optimized Android release build (R8 + native -O3), signed with the publicly shared development-only certificate so previous test installations can update without clearing local data. NOT a production signing key. SF3 import converts Vorbis samples offline to SF2 using Android MediaCodec; decoded SF2 needs substantially more storage. Android device-level validation is still required."
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" LivePerformer-v0.4.6.apk LivePerformer-v0.4.6.zip LivePerformer-v0.4.6.sha256 --clobber
          else
            gh release create "$TAG" LivePerformer-v0.4.6.apk LivePerformer-v0.4.6.zip LivePerformer-v0.4.6.sha256 \
              --target "$GITHUB_SHA" --prerelease \
              --title "LivePerformer v0.4.6 (optimized test APK)" \
              --notes "$NOTES"
          fi
      - name: Upload optimized APK artifact
        if: always() && hashFiles('app/build/outputs/apk/release/*.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: LivePerformer-optimized-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
